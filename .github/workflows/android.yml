# Every push: unit tests, then a debug APK artifact.
# Push to master: that APK also replaces the GitHub Release tagged debug.
# Push to master: a signed AAB artifact. It is not uploaded to Play.
name: Android

on:
  push:

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write .env
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: python3 scripts/ci-android-env.py dotenv

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: python3 scripts/ci-android-env.py debug-keystore

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Name the APK
        id: apk
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          file="wotcost-${version}-${sha}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish debug APK
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cp "${{ steps.apk.outputs.file }}" wotcost-debug.apk
          python3 scripts/play-closed-track.py note > "$RUNNER_TEMP/apk-note.txt"
          printf '\n\nТестовая сборка для установки в обход Play. Поверх копии из Play не встаёт.\n' >> "$RUNNER_TEMP/apk-note.txt"
          gh release delete debug --yes --cleanup-tag || true
          gh release create debug wotcost-debug.apk \
            --target "$GITHUB_SHA" \
            --title "wotcost ${{ steps.apk.outputs.version }} (${{ steps.apk.outputs.sha }})" \
            --notes-file "$RUNNER_TEMP/apk-note.txt" \
            --latest

  aab:
    name: Release AAB
    needs: apk
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write .env
        env:
          WG_APPLICATION_ID: ${{ secrets.WG_APPLICATION_ID }}
        run: python3 scripts/ci-android-env.py dotenv

      - name: Install upload keystore
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: python3 scripts/ci-android-env.py keystore

      - name: Bundle release
        working-directory: android
        run: ./gradlew :app:bundleRelease -Pwotcost.versionCode=${{ github.run_number }}

      - name: Check upload certificate
        env:
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: python3 scripts/play-closed-track.py check-cert

      - name: Name the AAB
        id: aab
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          file="wotcost-${version}-${{ github.run_number }}-${sha}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.aab.outputs.file }}
          path: ${{ steps.aab.outputs.file }}
          if-no-files-found: error
          compression-level: 0
